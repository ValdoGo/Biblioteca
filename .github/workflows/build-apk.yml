name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This project didn't ship with a Gradle wrapper, so we install
      # Gradle directly. AGP 9.1.x requires Gradle >= 9.3.1.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # The debug signingConfig points at a debug.keystore that isn't
      # committed to the repo (it's in .gitignore on purpose). We create
      # a throwaway one here just so the debug build has something to sign with.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # .env.example already ships in the repo with the Gemini/Firebase
      # keys commented out, so the app's built-in fallback (the real
      # google-services.json already included in this project) is used.
      # We just need an (empty) .env for the Secrets Gradle Plugin to read.
      - name: Prepare env files
        run: |
          cat > .env.example << 'EOF'
          # GEMINI_API_KEY: Required for Gemini AI API calls.
          # GEMINI_API_KEY=MY_GEMINI_API_KEY

          # FIREBASE CONFIGURATION
          # Preencha com as credenciais do seu projeto Firebase Console.
          # Deixe comentado para usar o projeto Firebase padrao ja embutido no
          # codigo (ver app/google-services.json) sem precisar configurar nada.
          # FIREBASE_API_KEY=AIzaSyYourApiKeyHere
          # FIREBASE_AUTH_DOMAIN=your-app.firebaseapp.com
          # FIREBASE_PROJECT_ID=your-app-id
          # FIREBASE_STORAGE_BUCKET=your-app.appspot.com
          # FIREBASE_MESSAGING_SENDER_ID=123456789012
          # FIREBASE_APP_ID=1:123456789012:android:abcdef123456
          EOF
          touch .env

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
